<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>VisionOS</title>
    <style>
      :root {
        --accent: #ffd400;
        --danger: #ff4b3e;
        --fg: #fff;
        --scrim: rgba(0, 0, 0, 0.62);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      /* Must outrank the id selectors below. `#controls { display: flex }` has
         specificity 1,0,0 and silently beat the UA's `[hidden]` rule at 0,1,0,
         so hidden elements rendered anyway. */
      [hidden] { display: none !important; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #000; color: var(--fg);
        font: 500 16px/1.4 system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
      }

      /* Camera is the whole screen; everything else floats over it. */
      #camera {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        background: #000;
      }

      /* The primary action for a user who cannot see the buttons: tap
         anywhere. Corner targets are hard to find by touch. */
      #tap-layer {
        position: fixed; inset: 0;
        border: 0; padding: 0; background: transparent;
        color: transparent; font-size: 0;
      }
      #tap-layer:active { background: rgba(255, 212, 0, 0.16); }

      #start {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        border: 0; background: rgba(0, 0, 0, 0.88);
        color: var(--accent);
        font: 700 30px/1.3 system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px;
        z-index: 40;
      }
      #start small { font-size: 16px; font-weight: 500; color: #aaa; max-width: 20rem; }

      /* Compact controls, thumb-reachable in the bottom corner. */
      #controls {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; gap: 9px;
        z-index: 30;
      }
      #controls button {
        width: 62px; height: 62px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: var(--scrim);
        color: var(--fg);
        backdrop-filter: blur(8px);
        font: 600 10px/1.15 system-ui, sans-serif;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 2px;
        cursor: pointer;
      }
      #controls button .glyph { font-size: 21px; line-height: 1; }
      #controls button:active { background: var(--accent); color: #000; border-color: var(--accent); }
      #controls button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      #ask[data-listening="true"] { background: var(--danger); border-color: var(--danger); }
      #stop { border-color: rgba(255, 75, 62, 0.75); }

      #status {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        margin: 0; padding: 6px 11px;
        background: var(--scrim); backdrop-filter: blur(8px);
        border-radius: 999px;
        font-size: 12.5px; color: var(--accent);
        max-width: 68vw;
        z-index: 30;
      }

      #transcript {
        position: fixed;
        left: max(10px, env(safe-area-inset-left));
        bottom: max(14px, env(safe-area-inset-bottom));
        width: min(60vw, 30rem);
        max-height: 34vh; overflow-y: auto;
        padding: 10px 12px;
        background: var(--scrim); backdrop-filter: blur(8px);
        border-radius: 12px;
        font-size: 14px; line-height: 1.4;
        z-index: 20;
      }
      #transcript:empty { display: none; }
      #transcript p { margin: 0 0 7px; }
      #transcript p:last-child { margin-bottom: 0; }
      #transcript p.hazard { color: var(--danger); font-weight: 700; }

      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <h1 class="sr-only">VisionOS — your digital sense of sight</h1>

    <video id="camera" playsinline muted aria-hidden="true"></video>

    <!-- Full-screen tap target, so the primary action needs no aiming. -->
    <button id="tap-layer" hidden aria-label="Scan the room and describe it">
      Scan the room
    </button>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="transcript" role="log" aria-live="polite" aria-label="Spoken history"></div>

    <div id="controls" hidden>
      <button id="ask" aria-label="Hold to ask a question about your surroundings">
        <span class="glyph" aria-hidden="true">&#127908;</span>Ask
      </button>
      <button id="read" aria-label="Read any text or sign in view">
        <span class="glyph" aria-hidden="true">&#128196;</span>Read
      </button>
      <button id="scan" aria-label="Scan the room and describe it">
        <span class="glyph" aria-hidden="true">&#128301;</span>Scan
      </button>
      <button id="stop" aria-label="Stop speaking">
        <span class="glyph" aria-hidden="true">&#9632;</span>Stop
      </button>
    </div>

    <button id="start" aria-describedby="start-help">
      Start VisionOS
      <small>Tap anywhere to scan. An assistive tool, not a replacement for a cane or guide dog.</small>
    </button>
    <p id="start-help" class="sr-only">
      Starts the camera and speaks a description of your surroundings.
      Once running, tap anywhere on the screen to scan the room.
    </p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
