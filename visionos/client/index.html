<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>VisionOS</title>
    <style>
      :root {
        --accent: #ffd400;
        --danger: #ff4b3e;
        --fg: #fff;
        --scrim: rgba(0, 0, 0, 0.66);
        --bar-height: 84px;
        --inset-bottom: max(12px, env(safe-area-inset-bottom));
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      /* Must outrank the id selectors below, or hidden elements render anyway. */
      [hidden] { display: none !important; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #000; color: var(--fg);
        font: 500 16px/1.4 system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
      }

      /* Camera is the whole screen; everything else floats over it. */
      #camera {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        background: #000;
      }

      /* The primary action needs no aiming: tap anywhere to scan. */
      #tap-layer {
        position: fixed; inset: 0;
        border: 0; padding: 0; background: transparent;
        color: transparent; font-size: 0;
      }
      #tap-layer:active { background: rgba(255, 212, 0, 0.16); }

      #start {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        border: 0; background: rgba(0, 0, 0, 0.88);
        color: var(--accent);
        font: 700 30px/1.3 system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px;
        z-index: 40;
      }
      #start small { font-size: 16px; font-weight: 500; color: #aaa; max-width: 20rem; }

      /* Three large targets along the bottom edge, found by thumb. */
      #controls {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
        padding: 10px max(12px, env(safe-area-inset-right)) var(--inset-bottom)
                 max(12px, env(safe-area-inset-left));
        z-index: 30;
      }
      #controls button {
        height: var(--bar-height);
        border-radius: 18px;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: var(--scrim);
        color: var(--fg);
        backdrop-filter: blur(8px);
        font: 700 15px/1.2 system-ui, sans-serif;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 4px;
        cursor: pointer;
      }
      #controls button .glyph { font-size: 26px; line-height: 1; }
      #controls button:active { background: var(--accent); color: #000; border-color: var(--accent); }
      #controls button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      /* Held, not tapped: the browser must not start a scroll or a long-press. */
      #ask { touch-action: none; user-select: none; -webkit-user-select: none; }
      #ask[data-listening="true"] { background: var(--danger); border-color: var(--danger); }
      #stop { border-color: rgba(255, 75, 62, 0.75); }

      #status {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        margin: 0; padding: 6px 12px;
        background: var(--scrim); backdrop-filter: blur(8px);
        border-radius: 999px;
        font-size: 13px; color: var(--accent);
        max-width: 80vw;
        z-index: 30;
      }
      #status:empty { display: none; }

      /* The last thing said, large, with two earlier lines faded beneath it. */
      #transcript {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        bottom: calc(var(--bar-height) + var(--inset-bottom) + 22px);
        margin: 0; padding: 12px 14px;
        background: var(--scrim); backdrop-filter: blur(8px);
        border-radius: 14px;
        font-size: 15px; line-height: 1.35;
        z-index: 20;
      }
      #transcript:empty { display: none; }
      #transcript p { margin: 0 0 6px; opacity: 0.6; }
      #transcript p:first-child { font-size: 20px; font-weight: 600; opacity: 1; }
      #transcript p:last-child { margin-bottom: 0; }
      #transcript p.hazard { color: var(--danger); font-weight: 700; opacity: 1; }

      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <h1 class="sr-only">VisionOS — your digital sense of sight</h1>

    <video id="camera" playsinline muted aria-hidden="true"></video>

    <button id="tap-layer" hidden aria-label="Scan the room and describe it">
      Scan the room
    </button>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="transcript" role="log" aria-live="polite" aria-label="Spoken history"></div>

    <div id="controls" hidden>
      <button id="read" aria-label="Read any text or sign in view">
        <span class="glyph" aria-hidden="true">&#128196;</span>Read
      </button>
      <button id="ask" aria-label="Hold to ask a question or give a command">
        <span class="glyph" aria-hidden="true">&#127908;</span>Hold to ask
      </button>
      <button id="stop" aria-label="Stop speaking">
        <span class="glyph" aria-hidden="true">&#9632;</span>Stop
      </button>
    </div>

    <button id="start" aria-describedby="start-help">
      Start VisionOS
      <small>Tap anywhere to scan. An assistive tool, not a replacement for a cane or guide dog.</small>
    </button>
    <p id="start-help" class="sr-only">
      Starts the camera and speaks a description of your surroundings.
      Once running, tap anywhere to scan, press Read to read a sign, or hold
      Ask to speak a question.
    </p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
