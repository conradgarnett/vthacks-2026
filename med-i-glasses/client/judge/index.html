<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Med-i-Glasses — Judge View</title>
    <style>
      :root { --bg:#0b0e14; --panel:#151a23; --fg:#e6edf3; --muted:#8b949e; --accent:#ffd400; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header { padding: 14px 18px; border-bottom: 1px solid #222a35; }
      h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .grid { display: grid; gap: 14px; padding: 14px; grid-template-columns: 1fr; }
      @media (min-width: 900px) { .grid { grid-template-columns: 3fr 2fr; } }
      section { background: var(--panel); border: 1px solid #222a35; border-radius: 10px; padding: 12px; }
      h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); }
      pre { margin: 0; white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
      .metric { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #222a35; }
      .metric:last-child { border-bottom: 0; }
      .metric b { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Med-i-Glasses — Judge View</h1>
      <p>What the blind user is hearing, made visible.</p>
    </header>

    <div class="grid">
      <section>
        <h2>Latency (rolling)</h2>
        <div id="metrics"><span style="color:var(--muted)">waiting for backend…</span></div>
      </section>
      <section>
        <h2>Backend</h2>
        <pre id="health">…</pre>
      </section>
    </div>

    <script type="module" src="/judge/main.ts"></script>
  </body>
</html>
